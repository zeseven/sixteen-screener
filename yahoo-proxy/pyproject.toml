[project]
name = "yahoo-proxy"
version = "0.1.0"
description = "Read-only proxy to Yahoo Finance data for the Sixteen Screener backend"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "msgspec>=0.22.0",
    "rusty-results>=1.1.1",
    "uvicorn>=0.54.0",
    "yfinance==1.8.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "httpx2>=2.16.2",
    "pandas-stubs>=3.1.0.261029",
    "poethepoet>=0.49.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["uv_build>=0.13.10,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["stubs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH", "PL", "RUF", "TID"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913", "TID251"]
"scripts/**" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"yfinance".msg = "Use yahoo_proxy.yfinance_source instead"

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src", "tests", "scripts"]
stubPath = "stubs"
reportAny = "error"
reportExplicitAny = "error"
reportImplicitStringConcatenation = "none"
reportUnusedCallResult = "none"
reportUnnecessaryIsInstance = "none"
reportUnnecessaryTypeIgnoreComment = "error"
reportMissingModuleSource = "error"
reportPrivateUsage = "error"
reportOptionalMemberAccess = "error"
reportOptionalCall = "error"
reportAttributeAccessIssue = "error"

[tool.poe.tasks]
format = "ruff format ."
lint = "ruff check ."
typecheck = "basedpyright"
test = "pytest"
lint_full = ["format_check", "lint", "typecheck", "test"]

[tool.poe.tasks.format_check]
cmd = "ruff format --check ."
