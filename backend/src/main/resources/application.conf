port = 8080
gcpProjectId = ""
firestoreDatabase = sixteen-screener
logoBucket = ""

defaultSources {
  search = finnhub
  us = finnhub
  international = eodhd
}

sources = [
  {
    id = finnhub
    name = Finnhub
    enabled = true
    baseUrl = "https://finnhub.io/api/v1"
    capabilities = [SEARCH, QUOTE, RATIOS, BALANCE_SHEET, COMPANY_PROFILE]
    roles = [SEARCH, US]
    automaticRequests = true
    limits = [{ interval = MINUTE, limit = 60 }]
    timeoutMillis = 5000
    directoryExchanges = [US]
  },
  {
    id = eodhd
    name = EODHD
    enabled = true
    baseUrl = "https://eodhd.com/api"
    capabilities = [QUOTE, DIVIDENDS]
    roles = [INTERNATIONAL]
    automaticRequests = false
    limits = [{ interval = DAY, limit = 20 }, { interval = MINUTE, limit = 20 }]
    timeoutMillis = 5000
    directoryExchanges = []
  },
  {
    id = sec-edgar
    name = "SEC EDGAR"
    enabled = true
    baseUrl = "https://data.sec.gov"
    additionalBaseUrls = { files = "https://www.sec.gov" }
    capabilities = [BALANCE_SHEET]
    roles = []
    limits = [{ interval = MINUTE, limit = 300 }]
    timeoutMillis = 10000
  },
  {
    id = logoapi
    name = "logoapi.sh"
    enabled = true
    baseUrl = "https://logoapi.sh"
    capabilities = [LOGO]
    roles = []
    limits = [{ interval = DAY, limit = 1000 }]
    timeoutMillis = 5000
  },
  {
    id = finnhub-logos
    name = "Finnhub logos"
    enabled = true
    baseUrl = "https://static2.finnhub.io/file/publicdatany/finnhubimage/stock_logo"
    capabilities = [LOGO]
    roles = []
    limits = []
    countTotalCalls = true
    timeoutMillis = 5000
  }
]
