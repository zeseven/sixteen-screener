substitutions:
  _REGION: europe-west4
  _AR_REPOSITORY: sixteen-screener
  _SERVICE_NAME: sixteen-screener-backend
  _TAG: latest

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE_NAME}:${_TAG}
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE_NAME}:${_TAG}

timeout: 3600s

options:
  machineType: E2_HIGHCPU_32
  logging: CLOUD_LOGGING_ONLY
