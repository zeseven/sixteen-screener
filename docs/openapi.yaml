openapi: 3.0.3
info:
  title: Sixteen Screener API
  version: 0.1.0
  description: |
    Backend API of the Sixteen Screener app.

    Conventions:
    - `x-milestone` on operations and schema properties marks the milestone (alpha, beta, rc) in which the element is implemented.
      Elements without the marker belong to alpha.
    - Per-user data (watchlist, tags, default sources, indicator settings) is scoped by the profile ID (UUID) in the path.
      The app gets the ID from `POST /profiles` by profile name. Profiles are not protected: any profile name can be used.
    - Company data is cached and shared between users. Data younger than 1 hour is fresh and is not re-requested from a source.
      When a source request limit is reached, or the source returns a response outside 2XX, times out or fails with an unexpected
      application error, the latest cached data is returned with a corresponding status. Without cached data the same status is
      returned with empty data (nullable fields are null, lists are empty); the app displays missing values as "-".
      Source failures don't produce error responses for company data.
    - Sources serve roles: `SEARCH`, `US` (companies of US exchanges) and `INTERNATIONAL` (companies of any other exchange).
      The backend takes the profile's default source of the company's role; the app is unaware of the roles.
    - Company data endpoints take a `trigger` (`AUTO` or `MANUAL`). A source with automatic requests on is called with `AUTO`
      when nothing is cached (detailed screen) or the cache is stale (watchlist market data), and always with `MANUAL`.
      A source with automatic requests off is never called with `AUTO`: stale cached data is returned as is, and without cached
      data the status is `NOT_REQUESTED`; with `MANUAL` it is called when nothing is cached or the cache is older than 1 hour.
    - Indicators are calculated by the backend using the profile's indicator settings. The app only renders them.
    - All timestamps are in UTC (RFC 3339).

servers:
  - url: https://{service-url}
    variables:
      service-url:
        default: sixteen-screener-backend.a.run.app
        description: Cloud Run service URL

security:
  - googleIdToken: []

tags:
  - name: Profiles
    description: Profile settings
  - name: Watchlist
    description: Per-profile watchlist
  - name: Search
    description: Company search
  - name: Companies
    description: Detailed company data per source
  - name: Tags
    description: Per-profile user tags
  - name: Indicators
    description: Per-profile indicator settings
  - name: Sources
    description: External data sources and their request limits
  - name: Exchanges
    description: Static exchange table
  - name: Logos
    description: Company logos

paths:
  /profiles:
    post:
      tags: [Profiles]
      operationId: getOrCreateProfile
      summary: Get or create a profile by name
      description: |
        Returns the profile with the given name, creating it if it doesn't exist.
        Names are compared after trimming surrounding whitespace, case-insensitively; the name is stored as first entered (trimmed).
        Used on the first start of the app and when switching profiles in settings. The app stores the returned ID and uses it in all
        profile-scoped requests.
      x-milestone: alpha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileCreate'
      responses:
        '200':
          description: Existing profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '201':
          description: Created profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'

  /profiles/{profileId}:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    get:
      tags: [Profiles]
      operationId: getProfile
      summary: Get profile settings
      description: Returns the profile.
      x-milestone: alpha
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Profiles]
      operationId: updateProfile
      summary: Update profile settings
      description: |
        Changes the profile's default source of one or more roles. A source must be configured for the role it is set for,
        otherwise `400` is returned.
      x-milestone: rc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /profiles/{profileId}/watchlist:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    get:
      tags: [Watchlist]
      operationId: getWatchlist
      summary: Get watchlist
      description: |
        Returns all companies of the profile's watchlist in insertion order. The watchlist stores the symbol, name, sector
        and tags of each company; ticker, exchange and market come from the exchange directory, or from the static exchange
        table for exchanges the source provides no symbol list for. No company data is read from the cache and no source
        requests are made (except an exchange directory download, ADR-034, ADR-063).
        Prices and indicators are loaded separately for the displayed rows with `GET /watchlist/market-data`.
        Filtering by market, sector and tags is done by the app in memory.
      x-milestone: alpha
      responses:
        '200':
          description: Watchlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Watchlist'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /profiles/{profileId}/watchlist/market-data:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    get:
      tags: [Watchlist]
      operationId: getWatchlistMarketData
      summary: Get market data of watchlist rows
      description: |
        Returns the quote and indicators of the given watchlist companies, each from the profile's default source of the
        company's role (`US` or `INTERNATIONAL`). Always an `AUTO` request: sources with automatic requests off are not
        called (stale cached data, or `NOT_REQUESTED` without cached data). Sources with automatic requests on refresh
        stale quotes (older than 1 hour) oldest first if the source limits allow; otherwise, or when the source fails,
        cached data is returned with the corresponding status. Company profiles are not requested.
        The app calls it for the rows it displays plus a buffer of 5 rows below them: when the watchlist is shown, when
        new rows are scrolled into view and when a filter changes.
        Items follow the watchlist order. Symbols that are not in the watchlist are skipped; duplicates are ignored.
      x-milestone: alpha
      parameters:
        - name: symbols
          in: query
          required: true
          description: Comma-separated symbols, e.g. `AAPL,SAP.DE`.
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 50
            items:
              $ref: '#/components/schemas/Symbol'
      responses:
        '200':
          description: Market data of the requested watchlist rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistMarketData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /profiles/{profileId}/watchlist/{symbol}:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
      - $ref: '#/components/parameters/Symbol'
    put:
      tags: [Watchlist]
      operationId: addToWatchlist
      summary: Add company to watchlist
      description: |
        Idempotent. A new company is stored with its name and its sector. The name comes from the exchange directory when
        the symbol is listed there, otherwise from the request body (the name of the search result), otherwise the ticker.
        Symbols of exchanges the search source provides no symbol list for (e.g. European exchanges on the Finnhub free plan)
        are accepted without validation; other symbols missing from the directory return `404`.
        The sector comes from the company profile of the profile's default source of the company's role:
        the cached profile if not expired, otherwise the profile is requested from the source (an `AUTO` request, so a
        source with automatic requests off is not called). When the request fails or
        the source limit is reached, the sector of an expired cached profile is used; the company is added with
        `sector = null` only when no profile is known (nothing cached and the request failed, or the source has no data).
        Adding a company that is already in the watchlist returns it unchanged without source requests.
        Returns `400` when the company is not in the watchlist yet and the watchlist is full (250 companies).
      x-milestone: alpha
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchlistAdd'
      responses:
        '200':
          description: Company is in the watchlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Watchlist]
      operationId: removeFromWatchlist
      summary: Remove company from watchlist
      description: Idempotent.
      x-milestone: alpha
      responses:
        '204':
          description: Company is not in the watchlist
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /profiles/{profileId}/search:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    get:
      tags: [Search]
      operationId: searchCompanies
      summary: Search companies
      description: |
        Searches the profile's default `SEARCH` source by ticker or the first letters of a company name.
        Results contain directory data only (ticker, exchange, name, market, logo); no company data is read from the cache
        and no requests other than the search itself are made.
        Queries of 1 or 2 characters match tickers only: results whose ticker starts with the query, exact ticker matches first.
        Longer queries match tickers and company names. At most 25 results are returned.
        The app sends a request after a 500 ms pause in typing or at once with the keyboard's search action, and never sends
        an empty query.
        When the source request limit is reached or the source call fails, the response is still `200` with empty items and
        the corresponding status; the app shows the reason under the search box.
      x-milestone: alpha
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 50
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResults'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /profiles/{profileId}/companies/{symbol}/sources:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
      - $ref: '#/components/parameters/Symbol'
    get:
      tags: [Companies]
      operationId: getCompanySources
      summary: Get selectable sources of the detailed screen tabs
      description: |
        Sources the source dropdown of each detailed screen tab offers for this company. A tab lists the sources configured
        for the company's role that provide the tab's data (`QUOTE` or `RATIOS` for price and ratios, `DIVIDENDS`,
        `BALANCE_SHEET`, `COMPANY_PROFILE`), plus `sec-edgar` for the balance sheet of US companies.
        Order: the profile's default source of the role first when it provides the tab's data, then the other sources in
        configuration order; Yahoo Finance is always last. The app selects the first source of each tab when the screen
        opens. A tab with an empty list has no source for the company. No source is called and no cache is read.
      x-milestone: beta
      responses:
        '200':
          description: Selectable sources per tab
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanySources'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /profiles/{profileId}/companies/{symbol}/price-ratios:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
      - $ref: '#/components/parameters/Symbol'
      - $ref: '#/components/parameters/Source'
      - $ref: '#/components/parameters/Trigger'
    get:
      tags: [Companies]
      operationId: getPriceAndRatios
      summary: Get price and ratios
      description: Data for the "Price and ratio" tab of the detailed screen from one source.
      x-milestone: alpha
      responses:
        '200':
          description: Price and ratios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceAndRatiosResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /profiles/{profileId}/companies/{symbol}/dividends:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
      - $ref: '#/components/parameters/Symbol'
      - $ref: '#/components/parameters/Source'
      - $ref: '#/components/parameters/Trigger'
    get:
      tags: [Companies]
      operationId: getDividends
      summary: Get dividends
      description: Data for the "Dividends" tab of the detailed screen from one source.
      x-milestone: beta
      responses:
        '200':
          description: Dividends
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DividendsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /profiles/{profileId}/companies/{symbol}/balance-sheet:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
      - $ref: '#/components/parameters/Symbol'
      - $ref: '#/components/parameters/Source'
      - $ref: '#/components/parameters/Trigger'
    get:
      tags: [Companies]
      operationId: getBalanceSheet
      summary: Get balance sheet
      description: |
        Data for the "Balance sheet" tab of the detailed screen from one source.
        In addition to price/ratio sources, `sec-edgar` can be requested as the source of truth for US companies.
        Data is returned as provided by the source (as-reported line items), without normalisation.
      x-milestone: alpha
      responses:
        '200':
          description: Balance sheet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceSheetResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /profiles/{profileId}/companies/{symbol}/profile:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
      - $ref: '#/components/parameters/Symbol'
      - $ref: '#/components/parameters/Source'
      - $ref: '#/components/parameters/Trigger'
    get:
      tags: [Companies]
      operationId: getCompanyProfile
      summary: Get company profile
      description: Data for the "Company profile" tab of the detailed screen from one source, with the profile's user tags.
      x-milestone: alpha
      responses:
        '200':
          description: Company profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /profiles/{profileId}/companies/{symbol}/tags:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
      - $ref: '#/components/parameters/Symbol'
    put:
      tags: [Tags]
      operationId: setCompanyTags
      summary: Set user tags of a company
      description: |
        Replaces all profile tags of the company. An empty list removes all tags. Tags are stored with the watchlist
        entry, so only companies in the watchlist can have tags: `400` for a company outside the watchlist. Removing a
        company from the watchlist removes its tags. `400` for more than 20 tags, an empty text after trimming, or two
        tags that are the same tag (equal icons, texts equal ignoring case).
      x-milestone: beta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagList'
      responses:
        '200':
          description: Tags of the company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /profiles/{profileId}/tags:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    get:
      tags: [Tags]
      operationId: getProfileTags
      summary: Get all user tags of the profile
      description: |
        All distinct tags used by the profile (same icon and text ignoring case count once, the first found is
        returned), sorted by text ignoring case, then by icon. Used for the watchlist tag filter and offered for reuse
        when a tag is added.
      x-milestone: beta
      responses:
        '200':
          description: Tags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /profiles/{profileId}/indicator-settings:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    get:
      tags: [Indicators]
      operationId: getIndicatorSettings
      summary: Get indicator settings
      description: |
        Returns the profile's indicator settings, one per indicator ratio, in settings order (the order of the defaults).
        A profile without settings gets a copy of the defaults stored first; ratios present in the defaults but missing
        in the profile are added from the defaults the same way (ADR-072).
      x-milestone: beta
      responses:
        '200':
          description: Indicator settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndicatorSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Indicators]
      operationId: replaceIndicatorSettings
      summary: Replace indicator settings
      description: |
        Replaces the indicator settings of the profile. Ratios missing in the request keep their stored settings
        (or get the defaults). Rejected with `400` when a ratio code is unknown or not an indicator ratio, a code is
        repeated, thresholds are not ordered (`t1 <= t2 <= t3`), a threshold is outside `[0, scaleMax]`, or there are
        not exactly 3 thresholds and 4 levels.
      x-milestone: beta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndicatorSettingsUpdate'
      responses:
        '200':
          description: Stored indicator settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndicatorSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /profiles/{profileId}/indicator-settings/reset:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    post:
      tags: [Indicators]
      operationId: resetIndicatorSettings
      summary: Reset indicator settings to defaults
      x-milestone: rc
      responses:
        '200':
          description: Default indicator settings, now stored for the profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndicatorSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /profiles/{profileId}/sources:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    get:
      tags: [Sources]
      operationId: getSources
      summary: Get sources
      description: |
        All configured sources with capabilities, roles, request limits and current usage. The roles each source is the
        profile's default source for are listed, and the default `SEARCH` source is marked.
      x-milestone: alpha
      responses:
        '200':
          description: Sources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sources'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /exchanges:
    get:
      tags: [Exchanges]
      operationId: getExchanges
      summary: Get exchanges
      description: |
        The static exchange table: one row per known symbol suffix (suffixes of the same exchange give separate rows) and
        one row per US exchange with an empty suffix. Sorted by suffix, then MIC. Makes no source requests.
      x-milestone: beta
      responses:
        '200':
          description: Exchanges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exchanges'

  /logos/{symbol}:
    parameters:
      - $ref: '#/components/parameters/Symbol'
    get:
      tags: [Logos]
      operationId: getLogo
      summary: Get company logo
      description: |
        Returns the company logo as SVG or PNG. The first of these steps that finds a logo wins:
        1. SVG logo stored in the bucket (`logos/{symbol}.svg`);
        2. PNG logo stored in the bucket (`eodhd-logos/{symbol}.png`);
        3. PNG logo stored in the bucket (`finnhub-logos/{symbol}.png`);
        4. SVG logo downloaded from logoapi.sh and stored, unless a logoapi.sh miss was recorded in the last 14 days;
        5. PNG logo downloaded from eodhd.com/img/logos and stored, unless an EODHD logos miss was recorded in the last
           14 days. The path is built from the EODHD exchange code and the ticker; a symbol whose exchange has no EODHD
           code is a miss. The EODHD API is never called;
        6. PNG logo downloaded from static2.finnhub.io and stored, unless a Finnhub logos miss was recorded in the last
           14 days. The URL is the `logo` field of the cached Finnhub company profile; when no profile is cached or it has
           no logo, the URL is built from the ticker (US) or symbol (other exchanges). The Finnhub API is never called;
        7. the default SVG logo.
        A source with no logo for the company records a miss. A source that fails, times out or reached its limit is
        skipped without recording a miss.
        `Cache-Control`: 30 days for a stored or downloaded logo; 1 day for the default logo when the sources have no
        logo; 1 hour for the default logo when a source was skipped because of a failure, a timeout or a reached limit.
      x-milestone: alpha
      responses:
        '200':
          description: Logo
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=2592000
          content:
            image/svg+xml:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'

components:
  securitySchemes:
    googleIdToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Google-signed ID token with the Cloud Run service URL as the audience, checked by Cloud Run IAM (roles/run.invoker).
        The app mints it from the bundled service account key; the developer uses `gcloud auth print-identity-token`.

  parameters:
    ProfileId:
      name: profileId
      in: path
      required: true
      description: Profile ID returned by `POST /profiles`.
      schema:
        type: string
        format: uuid
      example: 3f2b8c1e-6d4a-4f7e-9b1a-2c5d8e7f9a10
    Symbol:
      name: symbol
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Symbol'
    Source:
      name: source
      in: query
      required: false
      description: |
        Source to take data from. Defaults to the profile's default source of the company's role. A source not configured
        for the company's role returns `NOT_SUPPORTED` without a request; `sec-edgar` is accepted for the balance sheet of
        US companies.
      schema:
        $ref: '#/components/schemas/SourceId'
    Trigger:
      name: trigger
      in: query
      required: false
      description: |
        What caused the request. MANUAL - the refresh button of the detailed screen; AUTO - anything else.
        AUTO returns cached data as is; when nothing is cached, the source is called only if its automatic requests are on,
        otherwise the status is `NOT_REQUESTED`.
        MANUAL calls a source with automatic requests on even if the cache is fresh, and a source with automatic requests
        off when nothing is cached or the cache is older than 1 hour. Source limits apply in both cases.
      schema:
        type: string
        enum: [AUTO, MANUAL]
        default: AUTO
      x-milestone: beta

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Profile, company or source not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Symbol:
      type: string
      description: |
        Canonical company identifier assigned by the backend: ticker for US companies, ticker with exchange suffix for others
        (e.g. `SAP.DE`, `SHEL.L`, `NESN.SW`). The backend maps it to each source's own symbol format.
      pattern: '^[A-Z0-9][A-Z0-9.\-]{0,19}$'
      example: AAPL

    SourceId:
      type: string
      description: |
        Configured source identifier. Known values: `finnhub`, `sec-edgar`, `logoapi` (alpha); `finnhub-logos`,
        `eodhd-logos`, `eodhd`, `yahoo` (beta); `fmp`, `tiingo`, `alpha-vantage` (rc).
      pattern: '^[a-z0-9\-]{1,30}$'
      example: finnhub

    Market:
      type: string
      description: |
        Market detected by exchange. UK (LSE) and Swiss (SIX) exchanges count as EU.
        Companies listed on exchanges outside both markets have no market (`null`).
      enum: [US, EU]

    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string

    Profile:
      type: object
      required: [id, name, defaultSources]
      properties:
        id:
          type: string
          format: uuid
          description: Profile ID assigned by the backend when the profile is created.
        name:
          type: string
        defaultSources:
          $ref: '#/components/schemas/DefaultSources'

    DefaultSources:
      type: object
      description: |
        Default source of each role. Taken from the backend configuration; stored per profile once switching is added (rc).
      required: [search, us, international]
      properties:
        search:
          $ref: '#/components/schemas/SourceId'
        us:
          $ref: '#/components/schemas/SourceId'
        international:
          $ref: '#/components/schemas/SourceId'
      x-milestone: beta

    ProfileCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Profile name; any characters. Surrounding whitespace is trimmed; must not be blank after trimming.
          minLength: 1
          maxLength: 40
          example: Alice

    ProfileUpdate:
      type: object
      description: Roles that are left out keep their default source.
      properties:
        search:
          $ref: '#/components/schemas/SourceId'
        us:
          $ref: '#/components/schemas/SourceId'
        international:
          $ref: '#/components/schemas/SourceId'
      x-milestone: rc

    WatchlistAdd:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
          description: Company name from the search result; used when the symbol is not in the exchange directory.
          example: Koninklijke Ahold Delhaize NV

    Company:
      type: object
      description: |
        Company identity. Exchange and market come from the exchange directory, or from the static exchange table when
        the source provides no symbol list for the exchange.
      required: [symbol, ticker, exchange, name, market, type, stock, logoUrl]
      properties:
        symbol:
          $ref: '#/components/schemas/Symbol'
        ticker:
          type: string
          example: AAPL
        exchange:
          type: string
          description: Short exchange name displayed under the ticker, at most 6 characters.
          example: NASDAQ
        name:
          type: string
          example: Apple Inc
        market:
          allOf:
            - $ref: '#/components/schemas/Market'
          nullable: true
          description: Null for exchanges outside the US and EU markets (no flag; shown only with the "all" market filter).
        type:
          type: string
          nullable: true
          description: |
            Security type as provided by the source's exchange directory (for a search result not listed there, by the
            search itself), e.g. "Common Stock", "REIT", "ADR", "Preference". Null when unknown.
          example: Common Stock
        stock:
          type: boolean
          description: |
            Whether the security is a stock: true when the type is "Common Stock" or "REIT" (case-insensitive) or unknown,
            false for every other type (ADR, GDR, preference share, fund, ...). The app shows the names of other securities
            in a different color (ADR-079).
        logoUrl:
          type: string
          description: Relative URL of the logo endpoint.
          example: /logos/AAPL

    WatchlistItem:
      description: A watchlist row without market data.
      allOf:
        - $ref: '#/components/schemas/Company'
        - type: object
          required: [sector, tags]
          properties:
            name:
              type: string
              description: |
                Company name stored with the watchlist entry when the company is added (exchange directory, otherwise the
                search result, otherwise the ticker); updated when the detailed screen fetches the company profile from the
                default source of the company's role.
            sector:
              type: string
              nullable: true
              description: |
                Sector as provided by the profile's default source of the company's role, stored with the watchlist entry when
                the company is added and updated when the detailed screen fetches the company profile from that source. Null
                when unknown.
              example: Technology
            sectorGroup:
              type: string
              nullable: true
              description: Sector mapped to the fixed list of predefined sectors (optional feature).
              x-milestone: beta
            tags:
              type: array
              description: Profile tags of the company, stored with the watchlist entry; empty until tags are implemented.
              items:
                $ref: '#/components/schemas/Tag'

    SearchItem:
      description: A search result.
      allOf:
        - $ref: '#/components/schemas/Company'
        - type: object
          required: [inWatchlist]
          properties:
            inWatchlist:
              type: boolean
              description: Whether the company is in the profile's watchlist.

    Watchlist:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 250
          items:
            $ref: '#/components/schemas/WatchlistItem'

    MarketData:
      type: object
      description: Quote and indicators of one watchlist row.
      required: [symbol, status, indicatorsStatus, quote, indicators]
      properties:
        symbol:
          $ref: '#/components/schemas/Symbol'
        status:
          type: string
          description: |
            Status of the quote, as in `SourceDataMeta.status`. The app draws the price in orange for
            LIMIT_REACHED and SOURCE_ERROR, and in the neutral color when there is no quote for NOT_SUPPORTED, NO_DATA and
            NOT_REQUESTED.
          enum: [FRESH, CACHED, LIMIT_REACHED, SOURCE_ERROR, NOT_SUPPORTED, NO_DATA, NOT_REQUESTED]
        indicatorsStatus:
          type: string
          description: |
            Status of the ratios the indicators are calculated from, as in `SourceDataMeta.status`. Ratios are refreshed
            when older than 1 day. The app draws the indicators in orange for LIMIT_REACHED and SOURCE_ERROR.
          enum: [FRESH, CACHED, LIMIT_REACHED, SOURCE_ERROR, NOT_SUPPORTED, NO_DATA, NOT_REQUESTED]
          x-milestone: beta
        quote:
          allOf:
            - $ref: '#/components/schemas/Quote'
          nullable: true
          description: Null when no quote is available.
        indicators:
          type: array
          description: Indicators in display order (ADR-073). The row shows the first 3 and `...` when there are more.
          items:
            $ref: '#/components/schemas/Indicator'
          x-milestone: beta

    WatchlistMarketData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/MarketData'

    SearchResults:
      type: object
      required: [source, status, items]
      properties:
        source:
          $ref: '#/components/schemas/SourceId'
        status:
          type: string
          description: |
            OK - the source was searched (or the same query was answered recently); items may be empty when nothing matches;
            LIMIT_REACHED - the source request limit is reached; items are empty;
            SOURCE_ERROR - the source call failed (response outside 2XX, timeout, unexpected application error); items are empty.
          enum: [OK, LIMIT_REACHED, SOURCE_ERROR]
        items:
          type: array
          maxItems: 25
          items:
            $ref: '#/components/schemas/SearchItem'

    Quote:
      type: object
      required: [price, currency, fetchedAt, trend]
      properties:
        price:
          type: number
          format: double
        currency:
          type: string
          description: ISO 4217 currency code.
          example: USD
        fetchedAt:
          type: string
          format: date-time
          description: |
            When the data was received from the source. The app derives the cache indicator from it:
            hidden if younger than 1 hour, 1 for today's data, 2 for yesterday's data, and so on.
        previousCachedPrice:
          type: number
          format: double
          nullable: true
          description: Latest cached price of the most recent earlier market day (in the exchange time zone), excluding the current day.
        trend:
          type: string
          description: Price compared to the previous cached price. UNCHANGED if equal or the previous price is absent.
          enum: [UP, DOWN, UNCHANGED]
        source:
          $ref: '#/components/schemas/SourceId'

    RatioCode:
      type: string
      description: |
        Ratio code shared across sources. All codes except `EPS` and `BOOK_VALUE_PER_SHARE` (per share amounts) can be
        indicators. Listed in display and settings order.
      enum: [PE, PB, PS, EV_EBITDA, EV_REVENUE, PCF, PFCF, PEG,
             ROE, ROA, ROI,
             GROSS_MARGIN, OPERATING_MARGIN, PRETAX_MARGIN, NET_MARGIN,
             REVENUE_GROWTH, REVENUE_GROWTH_5Y, EPS_GROWTH, EPS_GROWTH_5Y, DIVIDEND_GROWTH_5Y,
             CURRENT_RATIO, QUICK_RATIO,
             DEBT_TO_EQUITY, LT_DEBT_TO_EQUITY, INTEREST_COVERAGE,
             ASSET_TURNOVER, INVENTORY_TURNOVER, RECEIVABLES_TURNOVER,
             DIVIDEND_YIELD, PAYOUT_RATIO,
             BETA,
             EPS, BOOK_VALUE_PER_SHARE]
      example: PE

    RatioUnit:
      type: string
      description: PERCENT values are percents (`15` is 15%); the app appends `, %` to the full name. CURRENCY values are amounts per share.
      enum: [PERCENT, RATIO, CURRENCY]

    RatioCategory:
      type: string
      enum: [VALUATION, PROFITABILITY, MARGINS, GROWTH, LIQUIDITY, LEVERAGE, EFFICIENCY, DIVIDENDS, RISK, PER_SHARE]

    Ratio:
      type: object
      required: [code, name, unit, value]
      properties:
        code:
          type: string
          description: A `RatioCode`; unknown codes are ignored by the app.
          example: PE
        name:
          type: string
          description: Full display name, without the `, %` suffix.
          example: P/E
        unit:
          $ref: '#/components/schemas/RatioUnit'
        value:
          type: number
          format: double
          nullable: true
          description: Value returned by the source; null when the source doesn't provide it.

    IndicatorLevel:
      type: string
      description: NEUTRAL values make no indicator.
      enum: [GOOD, WARNING, NEUTRAL, BAD]

    Indicator:
      type: object
      description: |
        A switched on ratio whose value falls into a GOOD, WARNING or BAD interval. Neutral, missing and switched off
        ratios are not returned.
      required: [ratioCode, name, level]
      properties:
        ratioCode:
          type: string
          example: PE
        name:
          type: string
          description: Short name (at most 6 characters) shown on the company row.
          example: P/E
        level:
          type: string
          enum: [BAD, WARNING, GOOD]

    SourceDataMeta:
      type: object
      description: Origin and freshness of the data returned for one source.
      required: [source, status]
      properties:
        source:
          $ref: '#/components/schemas/SourceId'
        status:
          type: string
          description: |
            FRESH - data received from the source within the last hour;
            CACHED - stale cached data, refresh not requested;
            LIMIT_REACHED - a request was needed but the source limit is reached; cached data returned, or empty data if nothing is cached;
            SOURCE_ERROR - the source call failed (response outside 2XX, timeout, unexpected application error); cached data returned,
            or empty data if nothing is cached;
            NOT_SUPPORTED - the source doesn't provide this data;
            NO_DATA - the source has no data for the company;
            NOT_REQUESTED - nothing is cached and the source was not called because its automatic requests are off and the
            request was not manual (beta); the app shows empty data and a hint to refresh.
          enum: [FRESH, CACHED, LIMIT_REACHED, SOURCE_ERROR, NOT_SUPPORTED, NO_DATA, NOT_REQUESTED]
        fetchedAt:
          type: string
          format: date-time
          nullable: true
          description: When the returned data was received from the source; null when no data is returned.

    PriceAndRatiosResponse:
      type: object
      required: [meta, ratios]
      properties:
        meta:
          $ref: '#/components/schemas/SourceDataMeta'
        quote:
          allOf:
            - $ref: '#/components/schemas/Quote'
          nullable: true
        ratios:
          type: array
          items:
            $ref: '#/components/schemas/Ratio'
        indicators:
          type: array
          description: |
            Indicators of the profile's settings in display order (ADR-073). The app colors each ratio with the level of
            its indicator. A P/E calculated as price / EPS (when the source has no P/E and the EPS is negative) can make
            an indicator while the ratio value stays null (ADR-074).
          items:
            $ref: '#/components/schemas/Indicator'
          x-milestone: beta

    Dividend:
      type: object
      required: [exDate, amount, currency]
      properties:
        exDate:
          type: string
          format: date
        paymentDate:
          type: string
          format: date
          nullable: true
        recordDate:
          type: string
          format: date
          nullable: true
        declarationDate:
          type: string
          format: date
          nullable: true
        amount:
          type: number
          format: double
        currency:
          type: string
          example: USD

    DividendsResponse:
      type: object
      required: [meta, dividends]
      properties:
        meta:
          $ref: '#/components/schemas/SourceDataMeta'
        dividendYield:
          type: number
          format: double
          nullable: true
          description: Trailing twelve months dividend yield, percent.
        dividends:
          type: array
          description: Sorted by ex-date, newest first.
          items:
            $ref: '#/components/schemas/Dividend'

    BalanceSheetItem:
      type: object
      required: [concept, label, value]
      properties:
        concept:
          type: string
          description: Line item identifier as provided by the source (e.g. US GAAP concept name).
          example: AssetsCurrent
        label:
          type: string
          example: Total current assets
        value:
          type: number
          format: double
        unit:
          type: string
          example: USD

    BalanceSheetPeriod:
      type: object
      required: [periodEnd, fiscalYear, fiscalPeriod, items]
      properties:
        periodEnd:
          type: string
          format: date
        fiscalYear:
          type: integer
        fiscalPeriod:
          type: string
          enum: [FY, Q1, Q2, Q3, Q4]
        filedAt:
          type: string
          format: date
          nullable: true
        form:
          type: string
          nullable: true
          description: Filing form, e.g. 10-K or 10-Q.
        items:
          type: array
          items:
            $ref: '#/components/schemas/BalanceSheetItem'

    BalanceSheetResponse:
      type: object
      required: [meta, periods]
      properties:
        meta:
          $ref: '#/components/schemas/SourceDataMeta'
        periods:
          type: array
          description: Sorted by period end, newest first.
          items:
            $ref: '#/components/schemas/BalanceSheetPeriod'

    CompanyProfile:
      type: object
      required: [symbol, ticker, exchange, name, market, type, stock, homeExchange]
      properties:
        symbol:
          $ref: '#/components/schemas/Symbol'
        ticker:
          type: string
        exchange:
          type: string
        name:
          type: string
        market:
          allOf:
            - $ref: '#/components/schemas/Market'
          nullable: true
          description: Null for exchanges outside the US and EU markets.
        type:
          type: string
          nullable: true
          description: |
            Security type as provided by the source's exchange directory (for a search result not listed there, by the
            search itself), e.g. "Common Stock", "REIT", "ADR", "Preference". Null when unknown.
          example: Common Stock
        stock:
          type: boolean
          description: |
            Whether the security is a stock: true when the type is "Common Stock" or "REIT" (case-insensitive) or unknown,
            false for every other type (ADR, GDR, preference share, fund, ...). The app shows the names of other securities
            in a different color (ADR-079).
        homeExchange:
          type: boolean
          description: |
            Whether the exchange is the company's home exchange: the security is a stock, the exchange is a main venue and
            its country equals the company's country (ADR-079). False when the country is unknown.
        country:
          type: string
          nullable: true
          description: ISO 3166-1 alpha-2 country code.
        currency:
          type: string
          nullable: true
        sector:
          type: string
          nullable: true
        sectorGroup:
          type: string
          nullable: true
          x-milestone: beta
        industry:
          type: string
          nullable: true
        ipoDate:
          type: string
          format: date
          nullable: true
        marketCapitalization:
          type: number
          format: double
          nullable: true
        sharesOutstanding:
          type: number
          format: double
          nullable: true
        employees:
          type: integer
          nullable: true
        website:
          type: string
          nullable: true
        description:
          type: string
          nullable: true

    CompanyProfileResponse:
      type: object
      required: [meta]
      properties:
        meta:
          $ref: '#/components/schemas/SourceDataMeta'
        profile:
          allOf:
            - $ref: '#/components/schemas/CompanyProfile'
          nullable: true
        tags:
          type: array
          description: |
            Profile tags of the company, returned also when the profile data is unavailable (any status of `meta`).
            Empty for a company outside the watchlist.
          items:
            $ref: '#/components/schemas/Tag'
          x-milestone: beta

    Tag:
      type: object
      description: |
        A user tag: an icon from the app's predefined icon set and a text. Two tags are the same tag when their icons
        are equal and their texts are equal ignoring case. The backend trims the text and doesn't validate the icon
        against the icon set; the app shows a fallback icon for an icon it doesn't know.
      required: [icon, text]
      properties:
        icon:
          type: string
          pattern: '^[a-z0-9-]{1,40}$'
          description: ID of the icon in the app's predefined icon set.
          example: chess-king
        text:
          type: string
          minLength: 1
          maxLength: 100
          example: Dividend king
      x-milestone: beta

    TagList:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          uniqueItems: true
          description: At most 20 tags per company in a request to set the company's tags.
          items:
            $ref: '#/components/schemas/Tag'

    IndicatorSettingValues:
      type: object
      description: |
        Configurable part of a ratio's indicator setting. `thresholds` (t1 <= t2 <= t3, inclusive lower bounds) split
        `[0, +inf)` into the intervals `[0, t1)`, `[t1, t2)`, `[t2, t3)`, `[t3, +inf)`; `levels` gives the level of each
        interval in that order and `belowZeroLevel` the level of values below 0. Equal thresholds make an empty interval.
      required: [ratioCode, enabled, thresholds, levels, belowZeroLevel]
      properties:
        ratioCode:
          $ref: '#/components/schemas/RatioCode'
        enabled:
          type: boolean
        thresholds:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: number
            format: double
          example: [15, 25, 40]
        levels:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: '#/components/schemas/IndicatorLevel'
          example: [GOOD, NEUTRAL, WARNING, BAD]
        belowZeroLevel:
          $ref: '#/components/schemas/IndicatorLevel'

    IndicatorSetting:
      description: Indicator setting of a ratio with the ratio's fixed metadata (from the defaults, not editable).
      allOf:
        - $ref: '#/components/schemas/IndicatorSettingValues'
        - type: object
          required: [name, shortName, unit, category, scaleMax, step]
          properties:
            name:
              type: string
              example: P/E
            shortName:
              type: string
              example: P/E
            unit:
              $ref: '#/components/schemas/RatioUnit'
            category:
              $ref: '#/components/schemas/RatioCategory'
            scaleMax:
              type: number
              format: double
              description: Right end of the settings bar; values above it belong to the last interval.
              example: 60
            step:
              type: number
              format: double
              description: Step the thresholds snap to when dragged.
              example: 1

    IndicatorSettings:
      type: object
      required: [settings]
      properties:
        settings:
          type: array
          items:
            $ref: '#/components/schemas/IndicatorSetting'

    IndicatorSettingsUpdate:
      type: object
      required: [settings]
      properties:
        settings:
          type: array
          items:
            $ref: '#/components/schemas/IndicatorSettingValues'

    RequestLimit:
      type: object
      required: [interval, unit, limit, used]
      properties:
        interval:
          type: string
          enum: [MINUTE, HOUR, DAY, MONTH]
        unit:
          type: string
          description: What is counted. UNIQUE_SYMBOLS is used for Tiingo's monthly symbol limit.
          enum: [REQUESTS, UNIQUE_SYMBOLS]
        limit:
          type: integer
          nullable: true
          description: |
            Maximum per interval. Null for a counter without a limit (Yahoo Finance's daily counter): requests are counted
            and the counter resets with the interval, but no request is refused because of it.
          x-milestone: beta
        used:
          type: integer
        resetsAt:
          type: string
          format: date-time
          nullable: true

    CompanySources:
      type: object
      required: [priceRatios, dividends, balanceSheet, profile]
      properties:
        priceRatios:
          type: array
          items:
            $ref: '#/components/schemas/SourceOption'
        dividends:
          type: array
          items:
            $ref: '#/components/schemas/SourceOption'
        balanceSheet:
          type: array
          items:
            $ref: '#/components/schemas/SourceOption'
        profile:
          type: array
          items:
            $ref: '#/components/schemas/SourceOption'
      x-milestone: beta

    SourceOption:
      type: object
      required: [id, name, isDefault, automaticRequests]
      properties:
        id:
          $ref: '#/components/schemas/SourceId'
        name:
          type: string
          example: Yahoo Finance
        isDefault:
          type: boolean
          description: Whether this is the profile's default source of the company's role.
        automaticRequests:
          type: boolean
          description: False for sources called only on a manual refresh.
      x-milestone: beta

    Capability:
      type: string
      enum: [SEARCH, QUOTE, RATIOS, DIVIDENDS, BALANCE_SHEET, COMPANY_PROFILE, LOGO]

    SourceRole:
      type: string
      description: |
        SEARCH - company search; US - data of companies listed on US exchanges; INTERNATIONAL - data of companies listed on
        any other exchange.
      enum: [SEARCH, US, INTERNATIONAL]
      x-milestone: beta

    Source:
      type: object
      required: [id, name, capabilities, roles, defaultFor, isDefault, automaticRequests, limits]
      properties:
        id:
          $ref: '#/components/schemas/SourceId'
        name:
          type: string
          example: Finnhub
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
        roles:
          type: array
          description: Roles the source is configured for; empty for SEC EDGAR and the logo sources.
          items:
            $ref: '#/components/schemas/SourceRole'
          x-milestone: beta
        defaultFor:
          type: array
          description: Roles the source is the profile's default source for.
          items:
            $ref: '#/components/schemas/SourceRole'
          x-milestone: beta
        isDefault:
          type: boolean
          description: Whether this is the profile's default `SEARCH` source; the app marks it 'default'.
        automaticRequests:
          type: boolean
          description: False for sources called only on a manual refresh; the app marks them 'manual only'.
          x-milestone: beta
        limits:
          type: array
          items:
            $ref: '#/components/schemas/RequestLimit'
        lastCall:
          allOf:
            - $ref: '#/components/schemas/SourceCallOutcome'
          nullable: true
          description: Outcome of the last call to the source, for the connection indicator. Null if the source hasn't been called yet.
        pausedUntil:
          type: string
          format: date-time
          nullable: true
          description: |
            End of the pause after the source answered `429`, for sources configured with a pause (Yahoo Finance, 15 minutes).
            While paused, the source is not called and company data requests return cached data with `LIMIT_REACHED`.
            Null when the source is not paused.
          x-milestone: beta
        totalCalls:
          type: integer
          format: int64
          nullable: true
          description: |
            Number of calls to the source since the counter was introduced; never resets. Counted only for sources configured
            with a total counter (`eodhd-logos`, `finnhub-logos`); null for other sources.
          x-milestone: beta

    SourceCallOutcome:
      type: object
      description: |
        Outcome of a call to a source. The app displays it as a connection indicator: nothing for SUCCESS, the `httpStatus` code
        for HTTP_ERROR, "T" for TIMEOUT, "NPE" for APP_ERROR. Requests skipped because a limit is reached are not calls.
      required: [result, at]
      properties:
        result:
          type: string
          description: |
            SUCCESS - response in 2XX;
            HTTP_ERROR - response outside 2XX;
            TIMEOUT - no response received (timeout or connection failure);
            APP_ERROR - unexpected application error while calling the source or processing its response.
          enum: [SUCCESS, HTTP_ERROR, TIMEOUT, APP_ERROR]
        httpStatus:
          type: integer
          nullable: true
          description: Response status code; set for HTTP_ERROR.
          example: 400
        at:
          type: string
          format: date-time

    Exchanges:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Exchange'

    Exchange:
      type: object
      required: [suffix, shortName, fullName, mic, country, mainVenue, currency, timeZone, market]
      properties:
        suffix:
          type: string
          description: Symbol suffix without the dot; empty for US exchanges.
          example: V
        shortName:
          type: string
          description: Short exchange name displayed under the ticker, at most 6 characters.
          example: TSXV
        fullName:
          type: string
          example: TSX Venture Exchange
        mic:
          type: string
          description: ISO 10383 market identifier code.
          example: XTSX
        eodhdCode:
          type: string
          nullable: true
          description: |
            EODHD exchange code used to build EODHD symbols (`SAP.DE` is `SAP.XETRA`); null for exchanges EODHD doesn't
            cover. Shown next to the MIC.
          example: V
          x-milestone: beta
        yahooSuffix:
          type: string
          nullable: true
          description: |
            Suffix of Yahoo Finance symbols without the dot (`DE` for `SAP.DE`); an empty string for US exchanges, whose
            Yahoo symbols have no suffix; null for exchanges Yahoo Finance is not used for. Shown next to the EODHD code.
          example: DE
          x-milestone: beta
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code of the exchange.
          example: CA
        mainVenue:
          type: boolean
          description: |
            Whether domestic companies have their primary listing on the exchange; false for the German regional exchanges
            and the US OTC markets (ADR-079).
          example: true
        currency:
          type: string
          description: ISO 4217 currency code.
          example: CAD
        timeZone:
          type: string
          description: IANA time zone.
          example: America/Toronto
        market:
          allOf:
            - $ref: '#/components/schemas/Market'
          nullable: true
          description: Null for exchanges outside the US and EU markets.

    Sources:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Source'
